name: Node CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      # 🧪 Run unit + integration tests
      - name: Run Tests
        run: npm test

      # 📊 Run coverage (important for demo)
      - name: Generate Coverage Report
        run: npm run test:coverage

      # 🚀 Start server in background
      - name: Start Server
        run: |
          npm start &
          sleep 5

      # ⚡ Install JMeter
      - name: Install JMeter
        run: sudo apt-get update && sudo apt-get install -y jmeter

      # 📈 Run load test
      - name: Run Load Test
        run: |
          jmeter -n -t performance/test-plan.jmx -l results.jtl

      # 📤 Upload artifacts
      - name: Upload Test Results
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: |
            results.jtl
            coverage/