name: Node CI Pipeline

on:
  push:
    branches:
      - main
      - feature-permission-page

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install
        working-directory: ./Server

      - name: Run Tests
        run: npm test
        working-directory: ./Server

      - name: Generate Coverage Report
        run: npm run test:coverage
        working-directory: ./Server

      - name: Start Server
        run: |
          npm start &
          sleep 10
        working-directory: ./Server

      - name: Install JMeter
        run: sudo apt-get update && sudo apt-get install -y jmeter

      - name: Run Load Test
        run: |
          jmeter -n \
            -t Server/performance/test-plan.jmx \
            -l results.jtl

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            results.jtl
            Server/coverage/
